<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Records — Store em Breve</title>
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#080A06;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;position:relative;}

canvas{position:fixed;inset:0;z-index:0;}

.content{position:relative;z-index:10;text-align:center;padding:2rem;max-width:560px;}

.logo-wrap{margin-bottom:2.5rem;}
.logo-wrap img{width:90px;height:90px;filter:drop-shadow(0 0 18px rgba(141,198,63,0.7));animation:pulse 3s ease-in-out infinite;}

.badge{display:inline-block;font-size:10px;letter-spacing:.3em;color:#8DC63F;text-transform:uppercase;border:1px solid rgba(141,198,63,.35);padding:5px 16px;margin-bottom:2rem;position:relative;overflow:hidden;}
.badge::before{content:'';position:absolute;inset:0;background:conic-gradient(from var(--a),transparent 80%,#8DC63F,transparent 100%);animation:border-spin 3s linear infinite;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;padding:1px;}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg;}
@keyframes border-spin{to{--a:360deg;}}

h1{font-size:clamp(1.6rem,4vw,2.4rem);color:#fff;letter-spacing:.06em;text-transform:uppercase;line-height:1.15;margin-bottom:1rem;}
h1 span{color:#8DC63F;text-shadow:0 0 20px rgba(141,198,63,.6);}

p{font-size:14px;color:rgba(255,255,255,.5);line-height:1.8;margin-bottom:2.5rem;font-family:sans-serif;}

.back{display:inline-flex;align-items:center;gap:8px;color:#8DC63F;font-size:12px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(141,198,63,.3);padding:10px 24px;transition:all .25s;}
.back:hover{background:rgba(141,198,63,.08);border-color:#8DC63F;box-shadow:0 0 22px rgba(141,198,63,.2);}

.grid-overlay{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(141,198,63,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(141,198,63,.03) 1px,transparent 1px);background-size:44px 44px;animation:grid-move 20s linear infinite;}
@keyframes grid-move{to{background-position:0 -88px;}}

@keyframes pulse{0%,100%{filter:drop-shadow(0 0 14px rgba(141,198,63,.5));}50%{filter:drop-shadow(0 0 28px rgba(141,198,63,.9));}}

.dots{display:flex;justify-content:center;gap:6px;margin-bottom:2rem;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(141,198,63,.3);}
.dot.active{background:#8DC63F;box-shadow:0 0 8px #8DC63F;animation:blink 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.4s;}
.dot:nth-child(3){animation-delay:.8s;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
</style>
</head>
<body>

<div class="grid-overlay"></div>
<canvas id="c"></canvas>

<div class="content">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="Cyber Records">
  </div>

  <div class="badge">Cyber Records · Store</div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot active"></div>
    <div class="dot active"></div>
  </div>

  <h1>PÁGINA EM<br><span>CONSTRUÇÃO</span></h1>

  <p>Nossa loja de tecnologia empresarial está sendo preparada.<br>Em breve você terá acesso a equipamentos, licenças e soluções selecionadas pela Cyber Records.</p>

  <a href="../" class="back">← Voltar ao site</a>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, pts = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function mkPt() {
  return { x: Math.random()*W, y: Math.random()*H, vx:(Math.random()-.5)*.4, vy:-Math.random()*.5-.1, r: Math.random()*1.5+.5 };
}

function init() { resize(); pts = Array.from({length:80}, mkPt); }

function draw() {
  ctx.clearRect(0,0,W,H);
  pts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(141,198,63,0.6)';
    ctx.fill();
    pts.forEach(q => {
      const d = Math.hypot(p.x-q.x, p.y-q.y);
      if (d < 100) {
        ctx.beginPath();
        ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
        ctx.strokeStyle = `rgba(141,198,63,${(1-d/100)*.15})`;
        ctx.lineWidth = .5;
        ctx.stroke();
      }
    });
  });
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); });
init(); draw();
</script>
</body>
</html>
